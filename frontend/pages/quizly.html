<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Answer today's trivia questions in Quizly.">
    <meta name="theme-color" content="#0f1117">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="Daily Games">
    <meta name="apple-mobile-web-app-title" content="Quizly">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Quizly">
    <meta property="og:description" content="Answer today's trivia questions.">
    <meta property="og:image" content="/assets/icon.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Quizly">
    <meta name="twitter:description" content="Answer today's trivia questions.">
    <meta name="twitter:image" content="/assets/icon.png">
    <title>Quizly</title>
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/styles/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel quizly-panel" aria-labelledby="app-title">
        <nav class="site-nav" aria-label="Games">
          <a class="nav-link nav-home-link" href="/">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
            <span data-i18n="navHome">Home</span>
          </a>
          <a class="nav-link nav-current-link is-active" href="/quizly">
            <span class="nav-icon-wrap" aria-hidden="true">
              <img class="nav-game-icon" src="/assets/quizly-icon.png" alt="" onerror="this.hidden = true">
              <i class="fa-solid fa-circle-question"></i>
            </span>
            <span data-i18n="navQuizly">Quizly</span>
          </a>
          <details class="nav-menu">
            <summary class="nav-menu-trigger">
              <span class="nav-current">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <i class="fa-solid fa-gamepad"></i>
                </span>
                <span data-i18n="navMenu">Games</span>
              </span>
              <i class="fa-solid fa-chevron-down nav-menu-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-menu-list nav-menu-dropdown">
              <a class="nav-link" href="/angly">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <img class="nav-game-icon" src="/assets/angly-icon.png" alt="" onerror="this.hidden = true">
                  <i class="fa-solid fa-drafting-compass"></i>
                </span>
                <span data-i18n="navAngly">Angly</span>
              </a>
              <a class="nav-link" href="/colory">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <img class="nav-game-icon" src="/assets/colory-icon.png" alt="" onerror="this.hidden = true">
                  <i class="fa-solid fa-palette"></i>
                </span>
                <span data-i18n="navColory">Colory</span>
              </a>
              <a class="nav-link" href="/timely">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <img class="nav-game-icon" src="/assets/timely-icon.png" alt="" onerror="this.hidden = true">
                  <i class="fa-solid fa-timeline"></i>
                </span>
                <span data-i18n="navTimely">Timely</span>
              </a>
              <a class="nav-link" href="/movly">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <img class="nav-game-icon" src="/assets/movly-icon.png" alt="" onerror="this.hidden = true">
                  <i class="fa-solid fa-film"></i>
                </span>
                <span data-i18n="navMovly">Movly</span>
              </a>
              <a class="nav-link is-active" href="/quizly">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <img class="nav-game-icon" src="/assets/quizly-icon.png" alt="" onerror="this.hidden = true">
                  <i class="fa-solid fa-circle-question"></i>
                </span>
                <span data-i18n="navQuizly">Quizly</span>
              </a>
            </div>
          </details>
        </nav>

        <header class="topbar">
          <div class="title-block">
            <h1 class="game-title" id="app-title">
              <span class="title-icon-wrap" aria-hidden="true">
                <img class="title-game-icon" src="/assets/quizly-icon.png" alt="" onerror="this.hidden = true">
                <i class="fa-solid fa-circle-question"></i>
              </span>
              <span data-i18n="title">Quizly</span>
            </h1>
          </div>

          <div class="top-actions">
            <div class="date-pill" id="dateLabel" data-i18n-aria="dailyDateLabel" aria-label="Daily date"></div>
            <button class="icon-button" id="statsButton" type="button" data-i18n-aria="openStats" aria-label="Open statistics">
              <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>
            </button>
            <div class="language-switch" role="group" data-i18n-aria="languageLabel" aria-label="Language">
              <button class="language-button" type="button" data-lang="it" data-i18n-aria="italianLanguage" aria-label="Italiano">🇮🇹</button>
              <button class="language-button" type="button" data-lang="en" data-i18n-aria="englishLanguage" aria-label="English">🇬🇧</button>
            </div>
          </div>
        </header>

        <div class="mode-switch" role="tablist" data-i18n-aria="difficultyLabel" aria-label="Difficulty">
          <button class="mode-button is-active" type="button" role="tab" aria-selected="true" data-mode="easy">
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            <span data-i18n="easy">Easy</span>
          </button>
          <button class="mode-button" type="button" role="tab" aria-selected="false" data-mode="hard">
            <i class="fa-solid fa-brain" aria-hidden="true"></i>
            <span data-i18n="hard">Hard</span>
          </button>
        </div>

        <section class="quizly-stage is-loading" id="quizlyStage" aria-live="polite">
          <div class="quizly-loading" id="quizlyLoading">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span data-i18n="loading">Loading today's trivia</span>
          </div>

          <div class="quizly-question-wrap" id="questionWrap" hidden>
            <div class="quizly-meta-row">
              <span class="quizly-progress" id="questionProgress">1/5</span>
              <span class="quizly-category" id="questionCategory"></span>
              <span class="quizly-difficulty" id="questionDifficulty"></span>
            </div>
            <h2 class="quizly-question" id="questionText"></h2>
            <div class="quizly-answers" id="answerGrid"></div>
          </div>

          <div class="quizly-result-panel" id="resultPanel" hidden>
            <p class="eyebrow" data-i18n="resultEyebrow">Result</p>
            <h2 id="resultTitle"></h2>
            <p id="resultCopy"></p>
          </div>
        </section>

        <div class="status-strip" id="statusStrip">
          <div class="status-copy">
            <i id="statusIcon" class="fa-solid fa-circle-question" aria-hidden="true"></i>
            <p id="statusText" class="status-text" data-i18n="ready">Pick the correct answer.</p>
          </div>
          <div class="attempt-dots" id="attemptDots" data-i18n-aria="questionsLabel" aria-label="Questions"></div>
        </div>

        <div class="quizly-actions">
          <button class="skip-button" id="retryButton" type="button" hidden>
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            <span data-i18n="retryButton">Retry</span>
          </button>
          <button class="skip-button" id="prevButton" type="button">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            <span data-i18n="prevButton">Previous</span>
          </button>
          <button class="guess-button" id="submitButton" type="button" disabled>
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
            <span data-i18n="submitButton">Submit</span>
          </button>
          <button class="skip-button" id="nextButton" type="button">
            <span data-i18n="nextButton">Next</span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </button>
        </div>

        <ol class="quizly-review-list" id="reviewList" data-i18n-aria="reviewLabel" aria-label="Answer review" hidden></ol>
      </section>
    </main>

    <dialog class="stats-dialog" id="statsDialog" aria-labelledby="statsTitle">
      <div class="stats-panel">
        <header class="stats-header">
          <div>
            <p class="eyebrow" data-i18n="statsEyebrow">Local stats</p>
            <h2 id="statsTitle" data-i18n="statsTitle">Statistics</h2>
          </div>
          <button class="icon-button" id="statsCloseButton" type="button" data-i18n-aria="closeStats" aria-label="Close statistics">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </header>

        <div class="stats-grid">
          <div class="stat-tile">
            <i class="fa-solid fa-gamepad" aria-hidden="true"></i>
            <span id="statsPlayed" class="stat-value">0</span>
            <span class="stat-label" data-i18n="statsPlayed">Played</span>
          </div>
          <div class="stat-tile">
            <i class="fa-solid fa-trophy" aria-hidden="true"></i>
            <span id="statsWins" class="stat-value">0</span>
            <span class="stat-label" data-i18n="statsWins">Wins</span>
          </div>
          <div class="stat-tile">
            <i class="fa-solid fa-percent" aria-hidden="true"></i>
            <span id="statsWinRate" class="stat-value">0%</span>
            <span class="stat-label" data-i18n="statsWinRate">Win rate</span>
          </div>
          <div class="stat-tile">
            <i class="fa-solid fa-fire" aria-hidden="true"></i>
            <span id="statsCurrentStreak" class="stat-value">0</span>
            <span class="stat-label" data-i18n="statsCurrentStreak">Streak</span>
          </div>
          <div class="stat-tile">
            <i class="fa-solid fa-medal" aria-hidden="true"></i>
            <span id="statsBestStreak" class="stat-value">0</span>
            <span class="stat-label" data-i18n="statsBestStreak">Best</span>
          </div>
        </div>

        <section class="distribution-section" aria-labelledby="distributionTitle">
          <h3 id="distributionTitle" data-i18n="distributionTitle">Scores</h3>
          <div class="distribution-list" id="statsDistribution"></div>
          <p id="statsEmpty" class="stats-empty" data-i18n="statsEmpty">Finish a daily puzzle to start tracking stats.</p>
        </section>
      </div>
    </dialog>

    <script src="/scripts/quizly.js"></script>
  </body>
</html>
